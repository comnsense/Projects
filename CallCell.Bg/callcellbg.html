<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallCell.Bg · Documents</title>
    <!-- Simple, clean menu style — no external dependencies -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .menu-card {
            max-width: 560px;
            width: 100%;
            background: white;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            padding: 2.5rem 2rem 2rem;
            transition: box-shadow 0.2s ease;
            border: 1px solid rgba(0, 120, 200, 0.1);
        }

        .menu-card:hover {
            box-shadow: 0 24px 48px -12px rgba(0, 90, 150, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0a2540;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .header h1 span {
            background: #0a66c2;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .subhead {
            color: #5b6f87;
            font-size: 1rem;
            margin-top: 0.5rem;
            font-weight: 400;
            border-bottom: 1px dashed #d9e2ec;
            padding-bottom: 1.2rem;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            list-style: none;
            margin: 1.8rem 0 0.8rem;
        }

        .menu-item {
            display: block;
            text-decoration: none;
            background: #f9fcff;
            border: 1.5px solid #d0e2f2;
            border-radius: 100px;
            padding: 1.2rem 1.8rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #0a2540;
            font-weight: 500;
            font-size: 1.2rem;
            letter-spacing: -0.01em;
        }

        .menu-item:hover {
            background: #e8f2fd;
            border-color: #0a66c2;
            transform: scale(1.01);
            box-shadow: 0 10px 20px -10px rgba(0, 102, 204, 0.3);
        }

        .menu-item:active {
            transform: scale(0.99);
            background: #daeaff;
        }

        .pdf-icon {
            background: #0a66c2;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 6px 12px -6px rgba(0, 70, 150, 0.4);
            transition: 0.2s;
        }

        .menu-item:hover .pdf-icon {
            background: #0b5ed7;
            box-shadow: 0 8px 16px -6px #0a66c2;
        }

        .link-text {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .link-text .filename {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0a2540;
            line-height: 1.3;
        }

        .link-text .small-note {
            font-size: 0.8rem;
            font-weight: 400;
            color: #4b6584;
            margin-top: 0.15rem;
            letter-spacing: 0.2px;
            opacity: 0.9;
        }

        .footer-note {
            text-align: center;
            margin-top: 2.2rem;
            font-size: 0.8rem;
            color: #7c8b9c;
            border-top: 1px solid #e2eaf2;
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
        }

        .footer-note code {
            background: #eef3f9;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #1e3a5f;
        }

        @media (max-width: 480px) {
            .menu-card {
                padding: 1.8rem 1.2rem;
            }

            .menu-item {
                padding: 1rem 1.2rem;
            }

            .link-text .filename {
                font-size: 1.1rem;
            }

            .pdf-icon {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
            }

            .header h1 {
                font-size: 1.7rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="menu-card">
        <div class="header">
            <h1>
                📁 CallCell.Bg
                <span>PDF</span>
            </h1>
            <div class="subhead">документи &nbsp;·&nbsp; documents</div>
        </div>

        <ul class="menu-list">
            <!-- Link to Contacts.pdf (relative path from the same folder) -->
            <li>
                <a class="menu-item" href="Contacts.pdf" target="_blank" rel="noopener noreferrer">
                    <span class="pdf-icon">📄</span>
                    <span class="link-text">
                        <span class="filename">Contacts.pdf</span>
                        <span class="small-note">контакти · contact list</span>
                    </span>
                </a>
            </li>
            <!-- Link to zastrahovki.pdf (relative path from the same folder) -->
            <li>
                <a class="menu-item" href="zastrahovki.pdf" target="_blank" rel="noopener noreferrer">
                    <span class="pdf-icon">📑</span>
                    <span class="link-text">
                        <span class="filename">zastrahovki.pdf</span>
                        <span class="small-note">застраховки · insurance</span>
                    </span>
                </a>
            </li>
        </ul>

        <div class="footer-note">
            <span>📍 <code>/Projects/CallCell.Bg/</code></span>
            <span>🔗 relative links</span>
        </div>
    </div>

    <!-- 
        Explanation: 
        – The HTML file (callcellbg.html) and both PDFs reside in the same folder:
          comnsense.github.io/Projects/CallCell.Bg/
        – href="Contacts.pdf" and href="zastrahovki.pdf" point directly to the files in that folder.
        – Opens in new tab (target="_blank") for convenience.
        – The absolute GitHub Pages paths are:
          https://comnsense.github.io/Projects/CallCell.Bg/Contacts.pdf
          https://comnsense.github.io/Projects/CallCell.Bg/zastrahovki.pdf
        – This menu is ready to be saved as callcellbg.html in the same directory.
    -->
</body>
</html>
